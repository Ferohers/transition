<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal</title>
<style>
/* MINIMAL, the app's built in code theme (founder, 6 Nov; was Tokens on top). Pam's approved board,
   hive/agents/pam-mt6kt8lf/work/office-home/office-home-tokens-top.html and SPEC.md, drawn only from the data line.
   Her colours, sizes and markup as they are; the app keeps its own top row, office switch and Theme button. */
:root{
  --ground:#F5F4EF; --surface:#FFFFFF; --raised:#ECEAE3; --hover:#F0EEE8; --active:#ECEAE3; --line:#DEDBD2; --line-strong:#CBC7BC;
  --ink:#1A1916; --ink-2:#44423C; --muted:#6B685F; --faint:#9B978D;
  --accent:#FFC94F; --accent-ink:#17150E; --accent-text:#8A5A00; --accent-soft:#FFF3D2; --accent-line:#F0CF7A;
  --mint:#3F8F5E; --mint-text:#2F7449; --mint-soft:#E7F0EB;
  --sky:#2F7FB8; --sky-text:#22679A; --sky-soft:#E6EFF6;
  --lilac:#7563B8; --lilac-text:#5F4EA3; --lilac-soft:#EEECF5;
  --amber:#B8621F; --amber-text:#96500F; --amber-soft:#F4E9E0;
  --sand-soft:#F0EEE8; --sand-text:#5E5B53;
  --shadow:0 1px 2px rgba(26,25,22,.06);
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
:root[data-scheme="dark"]{
  --ground:#131315; --surface:#1B1B1E; --raised:#232326; --hover:#26262A; --active:#26262A; --line:#2E2E32; --line-strong:#3D3D43;
  --ink:#ECEAE3; --ink-2:#C9C6BE; --muted:#8E8B83; --faint:#66645E;
  --accent:#FFD165; --accent-ink:#17150E; --accent-text:#FFCA54; --accent-soft:#3A2F12; --accent-line:#6B5620;
  --mint:#7FC59A; --mint-text:#8FD0A8; --mint-soft:#1E3227;
  --sky:#7DB8E4; --sky-text:#8EC3EA; --sky-soft:#1F3238;
  --lilac:#B4A5E8; --lilac-text:#C0B3EC; --lilac-soft:#2B2740;
  --amber:#E9A070; --amber-text:#EDAA7E; --amber-soft:#352822;
  --sand-soft:#26262A; --sand-text:#B8B5AD;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;container-type:size;container-name:page}
button{font:inherit;color:inherit;cursor:pointer}

.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface);color:var(--ink-2)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.c-mint{background:var(--mint-soft);color:var(--mint-text);border-color:color-mix(in srgb,var(--mint) 35%,transparent)}
.c-sky{background:var(--sky-soft);color:var(--sky-text);border-color:color-mix(in srgb,var(--sky) 35%,transparent)}
.c-lilac{background:var(--lilac-soft);color:var(--lilac-text);border-color:color-mix(in srgb,var(--lilac) 35%,transparent)}
.c-amber{background:var(--amber-soft);color:var(--amber-text);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.c-grey{background:var(--raised);color:var(--ink-2)}
.c-idle{background:transparent;color:var(--muted)}
.c-out{background:transparent;color:var(--ink-2)}
.av{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0;border:1px solid var(--line)}
.av.sm{width:20px;height:20px;border-radius:6px;font-size:10.5px}
.h-sky{background:var(--sky-soft);color:var(--sky-text)} .h-mint{background:var(--mint-soft);color:var(--mint-text)}
.h-lilac{background:var(--lilac-soft);color:var(--lilac-text)} .h-lemon{background:var(--accent-soft);color:var(--accent-text)}
.h-sand{background:var(--sand-soft);color:var(--sand-text)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.primary{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.04)}
.btn:disabled{opacity:.55;cursor:default}
.muted{color:var(--muted)}

.main{height:100%;min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px;padding:10px 16px 12px}
.grid{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:216px minmax(0,1fr);grid-template-areas:"limits limits asks" "active top asks"}
#s-active{grid-area:active} #s-asks{grid-area:asks} #s-top{grid-area:top} #s-limits{grid-area:limits}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size}
.sh{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--line);flex-shrink:0;min-height:36px}
#s-limits .sh{min-height:34px}
.sh h2{font-size:13.5px;font-weight:600;margin:0;white-space:nowrap}
.sh .sp{flex:1}
.sb{flex:1;min-height:0;overflow:auto}
.sf{border-top:1px solid var(--line);padding:4px 12px 3px;font-size:12px;color:var(--muted);flex-shrink:0}
.sm{font-size:11.5px}
.lnk{border:0;background:none;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.lnk:focus-visible,.prow:focus-visible{outline:2px solid var(--accent-line);outline-offset:0}
.step{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.when{color:var(--faint);font-size:11.5px;white-space:nowrap}
.empty{padding:12px;color:var(--muted)}

.arow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:3px 12px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.am{min-width:0}
.am .l1{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;height:19px}
.am .l1 .ttl{overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink-2)}
.am .l1 .ttl.lnk{font-weight:400}
.am .l2{display:flex;gap:8px;align-items:center;min-width:0;height:19px}
.am .l2 .sp{flex:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:3px 9px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--active);color:var(--ink);font-weight:500}
.seg.mini button{padding:2px 7px;font-size:11.5px}
.fbar{display:flex;padding:5px 8px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--surface)}
.seg.win{display:flex;width:100%}
.seg.win button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:2px 4px;white-space:nowrap}
.seg.win b{font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--faint)}
.seg.win button[aria-pressed="true"] b{color:var(--ink-2)}

#s-asks .sb{background:var(--ground)}
.asks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:5px;padding:5px 8px 6px;align-items:stretch}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;container-type:inline-size}
.ask .qt{margin:0;font-size:13px;line-height:18px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ask:not(.k-question) .qt{-webkit-line-clamp:2;color:var(--ink-2)}
.ask .qf{display:flex;align-items:center;gap:8px;margin-top:auto;min-height:26px}
.ask .qm{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.ask .qm .lnk{font-size:12px;font-weight:500}
.ask .qm .ds{color:var(--faint)}
.ask .qm > *{flex-shrink:0}
.ask .qx{display:flex;gap:6px;flex-shrink:0}
@container (max-width:340px){.ask .qm .av{display:none}}
.ask.done{flex-direction:row;align-items:center;gap:8px;background:var(--raised);min-height:38px}
.ask .qd{font-size:12.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ask .qerr{font-size:11.5px;color:var(--amber-text)}
textarea.answer-box{display:block;width:100%;height:40px;font:inherit;font-size:12.5px;line-height:17px;border:1px solid var(--line-strong);border-radius:8px;padding:4px 8px;background:var(--surface);color:var(--ink);resize:none;overflow:auto}
textarea.answer-box::placeholder{color:var(--faint)}
textarea.answer-box:focus{outline:2px solid var(--accent-line);outline-offset:0}
.qa-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:livepulse 2s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}
:root[data-motion="reduce"] .live i{animation:none}

/* Tasks: the line gives no card key and no time, so the row is the task's state, its title and its owner */
.trow{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-align:start;font-weight:400}
.trow .own{display:inline-flex;gap:6px;align-items:center;min-width:0;max-width:150px}
.trow .own .lnk{overflow:hidden;text-overflow:ellipsis}
@container (max-width:540px){
  .trow{grid-template-columns:62px minmax(0,1fr) auto;row-gap:0;padding:3px 12px}
  .trow .ttl{grid-column:2 / -1;grid-row:1;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .trow .own{grid-column:2;grid-row:2}
  .trow .chip.st{grid-column:3;grid-row:2}
}

.tk-head{padding:0 12px}
.tk-big{display:flex;align-items:baseline;gap:6px}
.tk-big b{font-size:26px;line-height:30px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--ink)}
.tk-big span{color:var(--muted);font-size:12.5px}
.tk-sub{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);margin-top:3px}
.tk-sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(52px,92px) minmax(70px,1fr) 42px 38px;gap:8px;align-items:center;min-height:24px;padding:0 12px;font-size:12.5px;cursor:pointer}
.prow:hover{background:var(--hover)}
.prow.ph{min-height:18px;cursor:default;font-size:11px;color:var(--muted);font-weight:600}
.prow.ph:hover{background:none}
.prow .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.prow .pr,.prow .pt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow .pr{font-weight:600;color:var(--ink)}
.prow .pt{color:var(--ink-2)}
.prow.ph .pr,.prow.ph .pt{font-weight:600;color:var(--muted)}
.hs{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;height:12px;min-width:0}
.hs i{border-radius:2px;background:var(--raised)}
.hs i.l1{background:color-mix(in srgb,var(--accent) 18%,var(--raised))}
.hs i.l2{background:color-mix(in srgb,var(--accent) 42%,var(--raised))}
.hs i.l3{background:color-mix(in srgb,var(--accent) 72%,var(--raised))}
.hs i.l4{background:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-line)}
.hs i.nr{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.hs i:hover{outline:1px solid var(--ink-2);outline-offset:0}
.ax{display:flex;justify-content:space-between;font-size:10px;font-weight:500;color:var(--faint);white-space:nowrap;min-width:0;overflow:hidden}
.tip{position:fixed;left:0;top:0;z-index:40;display:flex;gap:6px;align-items:baseline;padding:4px 8px;border-radius:6px;background:var(--ink);color:var(--ground);font-size:11.5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tk-quiet{padding:0 12px;font-size:12px;color:var(--muted)}
.tk-quiet .lnk{font-weight:500;color:var(--ink-2)}
.tk-plan{padding:0 12px;font-size:11.5px;color:var(--muted)}
.tk-plan b{font-weight:600;color:var(--ink-2)}
.tk-plan b.near{color:var(--amber-text)}
.tband{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.25fr)}
.tband .tl{padding:10px 0 8px;display:flex;flex-direction:column;gap:10px;border-inline-end:1px solid var(--line);min-width:0}
.tband .tr{padding:5px 0 6px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:0}
.tband .prow{min-height:19px}
.tband .prows{overflow:auto;min-height:0}
.tband .tk-plan{margin-top:auto}
[dir="rtl"] .prow .pr,[dir="rtl"] .prow .pt{text-align:left}

/* Pam's rule, on Home's slot: the grid while it is at least 860 wide and 480 tall (each list scrolls in its card);
   under that the sections stack and the page scrolls */
@container page (max-width:859px) or (max-height:479px){
  body{overflow:auto}
  .main{height:auto}
  .grid{flex:none;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"active" "asks" "top" "limits"}
  .tband{grid-template-columns:minmax(0,1fr)}
  .tband .tl{border-inline-end:0;border-bottom:1px solid var(--line)}
  .grid > .box{min-height:200px}
}
@container (max-width:460px){.sh .sub{display:none}}
</style>
</head>

function active() {

    if (q.options.length) {
      const row = el('div', 'qa-row');
      q.options.forEach((label, i) => { const b = el('button', 'btn sm', label); b.type = 'button'; b.addEventListener('click', () => act(q, { kind: 'answerAsk', ask: q.token, option: i }, w('answered'), `${w('answered')}${w('comma')}${label}`, true, err)); row.append(b); });
      c.append(row);
    }
    const qx = el('span', 'qx');
    const dec = el('button', 'btn sm', w('decline')); dec.type = 'button';
    dec.addEventListener('click', () => {
      const reason = box.value.trim();
      if (!reason) { err.textContent = w('declineNeedsReason'); err.hidden = false; box.focus(); return; }
      act(q, { kind: 'declineAsk', ask: q.token, reason: reason.slice(0, 500) }, w('declined'), w('declinedWords', { name: who, reason }), false, err);
    });
    const ans = el('button', 'btn sm primary', w('answer')); ans.type = 'button';
    ans.addEventListener('click', () => {
      const t = box.value.trim();
      if (!t) { box.focus(); return; }
      act(q, { kind: 'answerAsk', ask: q.token, text: t.slice(0, 2000) }, w('answered'), w('answeredWords', { name: who }), true, err);
    });
    qx.append(dec, ans); qf.append(qx);
  }
  c.append(qf, err);
  return c;
}
/** One action. The app answers: done, or refused (cancelled when the person closed the app's own sheet). */
function act(q, action, label, words, ok, err) {
  err.hidden = true;
  const said = window.md.ask(action);
  if (!said || typeof said.then !== 'function') return;
  said.then((out) => {
    if (!out) return;
    if (out.status === 'done') { done.set(q.token, { label, words, ok, until: Date.now() + LINGER_MS }); drafts.delete(q.token); setTimeout(draw, LINGER_MS + 50); draw(); }
    else if (out.status === 'refused' && out.reason !== 'cancelled') { err.textContent = w(out.reason === 'token' ? 'goneWords' : 'notSent'); err.hidden = false; }
  });
}

/* 3. TASKS: every Doing card (and Blocked, when the app lists them), last touched first */
function tasks() {
  const list = state.tasks;
  const blocked = list.some((t) => t.status === 'blocked');
  const out = [header(w('top'), list.length, 'c-out', w(blocked ? 'topSubBlocked' : 'topSub'))];
  const sb = el('div', 'sb');
  for (const t of list) {
    const a = agentOf(t.agent);
    const row = el('div', 'trow');
    const st = el('span', `chip ${t.status === 'blocked' ? 'c-amber' : 'c-mint'}`, w(t.status === 'blocked' ? 'task_blocked' : 'task_doing'));
    const title = el('button', 'lnk ttl', t.title); title.type = 'button'; title.title = t.title; title.dir = 'auto'; title.addEventListener('click', () => openTask(t.token));
    const own = el('span', 'own'); own.append(av(a, true), agentLink(a));
    row.append(st, title, own);
    if (a) row.append(chip(a.status, 'st'));
    sb.append(row);
  }
  if (!list.length) sb.append(el('div', 'empty', w('noTasks')));
  out.push(sb);
  return out;
}

/* 4. TOKENS: today's total is the headline; under it every agent burning tokens now, fastest first, with a strip of
   its last 14 minutes (one cell a minute). Hover a cell for its minute and its count. */
function cells(a) { const c = a.spark.slice(-14); while (c.length < 14) c.unshift(null); return c; }
function cellRange(k) { const from = (Math.floor(state.at / MIN) - 13 + k) * MIN; return [hhmm(from), hhmm(from + MIN)]; }
function strip(a) {
  const s = el('span', 'hs'); s.setAttribute('role', 'img');
  const c = cells(a);
  s.setAttribute('aria-label', w('stripLabel', { name: a.name, counts: c.map((v) => (v == null ? '-' : num(v))).join(w('comma')) }));
  c.forEach((v, k) => { const i = el('i', v == null ? 'nr' : `l${heat(v)}`); i.dataset.k = String(k); i.dataset.v = v == null ? '' : String(v); s.append(i); });
  return s;
}
function tokens() {
  const t = state.telemetry;
  const out = [header(w('tokens'), null, null, w('fastest'))];
  const band = el('div', 'tband');
  const tl = el('div', 'tl');
  const head = el('div', 'tk-head');
  const big = el('div', 'tk-big'); big.append(el('b', null, tkh(t.today.used)), el('span', null, w('today')));
  const sub = el('div', 'tk-sub');
  const s1 = el('span', null, w('h5') + ' '); s1.append(el('b', null, tk(t.fiveHour.used)));
  const s2 = el('span', null, w('week') + ' '); s2.append(el('b', null, tk(t.week.used)));
  const s3 = el('span', null, w('nowLabel') + ' '); s3.append(el('b', null, perMin(t.rate)), ' ' + w('aMin'));
  sub.append(s1, s2, s3); head.append(big, sub); tl.append(head);
  const quiet = state.agents.filter((a) => !(a.rate > 0)).sort((x, y) => y.today.used - x.today.used);
  if (quiet.length) {
    const q = el('div', 'tk-quiet', w('quiet') + ' ');
    quiet.forEach((a, i) => { if (i) q.append(w('comma')); q.append(agentLink(a), ' ' + tk(a.today.used)); });
    tl.append(q);
  }
  const tr = el('div', 'tr');
  const list = state.agents.filter((a) => a.rate > 0).sort((x, y) => y.rate - x.rate);
  if (list.length) {
    const rows = el('div', 'prows');
    const ax = el('span', 'ax'); ax.setAttribute('aria-hidden', 'true'); ax.append(el('span', null, w('axisFrom')), el('span', null, w('axisNow')));
    const ph = el('div', 'prow ph'); ph.append(el('span', null, w('burning')), ax, el('span', 'pr', w('aMin')), el('span', 'pt', w('todayShort')));
    rows.append(ph);
    for (const a of list) {
      const r = el('div', 'prow'); r.tabIndex = 0; r.setAttribute('role', 'button');
      r.setAttribute('aria-label', w('rowTip', { name: a.name, rate: perMin(a.rate), today: tk(a.today.used) }));
      r.addEventListener('click', () => openAgent(a.token));
      r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openAgent(a.token); } });
      r.append(el('span', 'pn', a.name), strip(a), el('span', 'pr', perMin(a.rate)), el('span', 'pt', tk(a.today.used)));
      rows.append(r);
    }
    tr.append(rows);
  } else tr.append(el('div', 'empty', w('noneBurning')));
  const near = t.engineLimits.slice().sort((x, y) => y.usedPercent - x.usedPercent)[0];
  if (near) {
    const p = el('div', 'tk-plan', `${w('plan')} ${limitName(near.name)} `);
    p.append(el('b', near.usedPercent >= PLAN_NEAR_PCT ? 'near' : null, `${Math.round(near.usedPercent)}%`));
    if (near.resetsInMs != null) {
      const m = Math.round(near.resetsInMs / MIN);
      p.append(w('comma') + (m < 60 ? w('resetsMin', { count: m }) : w('resetsHours', { h: Math.floor(m / 60), m: m % 60 })));
    }
    tr.append(p);
  }
  band.append(tl, tr); out.push(band);
  return out;
}

/* The hover tip on a strip cell: its minute and its exact count. */
document.addEventListener('mouseover', (e) => {
  const tip = $('tip');
  const i = e.target instanceof Element ? e.target.closest('.hs i') : null;
  if (!i || !state) { tip.classList.remove('on'); return; }
  const [from, to] = cellRange(Number(i.dataset.k));
  tip.textContent = i.dataset.v === '' ? w('noReading', { from, to }) : w('cellTip', { count: Number(i.dataset.v), from, to, n: num(Number(i.dataset.v)) });
  const r = i.getBoundingClientRect();
  tip.classList.add('on');
  const tw = tip.offsetWidth;
  tip.style.transform = `translate(${Math.max(4, Math.min(window.innerWidth - tw - 4, r.left + r.width / 2 - tw / 2))}px, ${Math.max(4, r.top - tip.offsetHeight - 6)}px)`;
});
</script>
